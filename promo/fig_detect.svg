<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
  <rect x="20" y="40" width="230" height="90" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="135" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3412">成果物が変わった</text>
  <text x="135" y="106" text-anchor="middle" font-size="15" fill="#6b7280">D5: 1200 → 1500</text>
  <g>
    <line x1="250" y1="85" x2="300" y2="85" stroke="#6b7280" stroke-width="3" marker-end="url(#a)"/>
    <rect x="305" y="20" width="200" height="130" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="405" y="50" text-anchor="middle" font-size="18" font-weight="700">① 候補を絞る</text>
    <text x="405" y="78" text-anchor="middle" font-size="14" fill="#374151">関連タスクの決定</text>
    <text x="405" y="100" text-anchor="middle" font-size="14" fill="#374151">＋ 埋め込みで近い決定</text>
    <text x="405" y="122" text-anchor="middle" font-size="14" fill="#374151">× 対象語を含むもの</text>
    <rect x="335" y="155" width="140" height="26" rx="13" fill="#d1fae5"/><text x="405" y="173" text-anchor="middle" font-size="13" fill="#065f46">埋め込みのみ・安い</text>
  </g>
  <g>
    <line x1="505" y1="85" x2="555" y2="85" stroke="#6b7280" stroke-width="3" marker-end="url(#a)"/>
    <rect x="560" y="20" width="200" height="130" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="660" y="50" text-anchor="middle" font-size="18" font-weight="700">② ルールで除外</text>
    <text x="660" y="78" text-anchor="middle" font-size="14" fill="#374151">決定が変更より前か</text>
    <text x="660" y="100" text-anchor="middle" font-size="14" fill="#374151">30日以内か</text>
    <text x="660" y="122" text-anchor="middle" font-size="14" fill="#374151">数式の値変化は除く</text>
    <rect x="590" y="155" width="140" height="26" rx="13" fill="#e5e7eb"/><text x="660" y="173" text-anchor="middle" font-size="13" fill="#374151">LLM 不使用</text>
  </g>
  <g>
    <line x1="760" y1="85" x2="810" y2="85" stroke="#6b7280" stroke-width="3" marker-end="url(#a)"/>
    <rect x="815" y="20" width="200" height="130" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="915" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">③ 判定</text>
    <text x="915" y="78" text-anchor="middle" font-size="14" fill="#374151">決定・変更・関連発言・</text>
    <text x="915" y="100" text-anchor="middle" font-size="14" fill="#374151">その後の決定を渡す</text>
    <text x="915" y="122" text-anchor="middle" font-size="14" fill="#374151">対象が別物なら矛盾にしない</text>
    <rect x="845" y="155" width="140" height="26" rx="13" fill="#fee2e2"/><text x="915" y="173" text-anchor="middle" font-size="13" fill="#991b1b">high（Opus）1件ずつ</text>
  </g>
  <line x1="915" y1="185" x2="915" y2="240" stroke="#6b7280" stroke-width="3" marker-end="url(#a)"/>
  <rect x="640" y="245" width="550" height="60" rx="14" fill="#111827"/>
  <text x="915" y="282" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">④ confidence で分岐</text>
  <g font-size="16">
    <line x1="700" y1="305" x2="700" y2="345" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
    <rect x="620" y="350" width="170" height="80" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="705" y="380" text-anchor="middle" font-weight="700" fill="#065f46">≥ 0.8 通知</text><text x="705" y="405" text-anchor="middle" font-size="13" fill="#374151">決定者と変更者へ</text>
    <line x1="915" y1="305" x2="915" y2="345" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
    <rect x="830" y="350" width="170" height="80" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <text x="915" y="380" text-anchor="middle" font-weight="700" fill="#92400e">≥ 0.5 確認キュー</text><text x="915" y="405" text-anchor="middle" font-size="13" fill="#374151">人が判断</text>
    <line x1="1130" y1="305" x2="1130" y2="345" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
    <rect x="1040" y="350" width="150" height="80" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="1115" y="380" text-anchor="middle" font-weight="700" fill="#374151">それ未満</text><text x="1115" y="405" text-anchor="middle" font-size="13" fill="#6b7280">記録のみ</text>
  </g>
  <g font-size="15" fill="#6b7280">
    <text x="30" y="260">2週間の架空データ:</text>
    <text x="30" y="290">変更 25 件 → 無視 22 ／ 通知 3 ／ 確認要求 0</text>
    <text x="30" y="330">評価セット 10 件:</text>
    <text x="30" y="360">検知 9 ／ 誤検知 0 ／ 見逃し 1</text>
    <text x="30" y="410" font-size="13">出典は必ず3点（決定の原文・共有・差分）</text>
  </g>
</svg>
