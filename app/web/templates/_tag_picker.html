{# タグ追加のプルダウン。tp_type / tp_id / all_tags を渡す #}
<div class="relative inline-block" x-data="{ open: false, q: '', tags: {{ all_tags|map(attribute='name')|list|tojson }}, colors: {{ all_tags|tag_colors|tojson }},
  get list() { const q = this.q.replace(/^#/, ''); return this.tags.filter(t => !q || t.includes(q)).slice(0, 8); },
  get canCreate() { const q = this.q.replace(/^#/, '').trim(); return q && !this.tags.includes(q); },
  submit(name) { const f = this.$refs.form; f.action = '/tags/' + encodeURIComponent(name) + '/link'; f.submit(); } }" @click.outside="open = false">
  <form x-ref="form" method="post" class="inline"><input type="hidden" name="target_type" value="{{ tp_type }}"><input type="hidden" name="target_id" value="{{ tp_id }}"></form>
  <button type="button" @click="open = !open; $nextTick(() => $refs.q.focus())" class="text-[11px] px-1.5 py-0.5 rounded border border-dashed border-gray-300 text-gray-500 hover:border-indigo-400 hover:text-indigo-600 font-normal">＋ タグ</button>
  <div x-show="open" x-cloak class="absolute left-0 top-6 z-30 w-56 bg-white border border-gray-200 rounded-lg shadow-lg p-2 text-sm font-normal">
    <input x-ref="q" x-model="q" placeholder="タグを検索 / 新規" @keydown.enter.prevent="list.length && !canCreate ? submit(list[0]) : (canCreate && submit(q.replace(/^#/, '').trim()))" class="w-full border border-gray-300 rounded px-2 py-1 text-xs mb-1">
    <div class="max-h-48 overflow-y-auto">
      <template x-for="t in list" :key="t">
        <button type="button" @click="submit(t)" class="w-full text-left px-2 py-1 rounded hover:bg-gray-100 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full" :class="'bg-' + (colors[t] || 'gray') + '-500'"></span><span x-text="'#' + t"></span></button>
      </template>
      <button type="button" x-show="canCreate" @click="submit(q.replace(/^#/, '').trim())" class="w-full text-left px-2 py-1 rounded hover:bg-indigo-50 text-indigo-700">＋ 新しいタグ「<span x-text="q.replace(/^#/, '').trim()"></span>」を作成</button>
      <div x-show="!list.length && !canCreate" class="px-2 py-1 text-xs text-gray-400">タグはありません。入力して作成できます</div>
    </div>
  </div>
</div>
