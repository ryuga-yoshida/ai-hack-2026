{% extends "base.html" %}
{% block title %}通知{% endblock %}
{% block heading %}通知 <span class="text-gray-400 font-normal text-sm ml-2">{{ me }} 宛</span>{% endblock %}
{% block content %}
<div class="max-w-3xl space-y-2">
  {% for n in items %}
  <a href="{{ n.href }}" class="block bg-white border rounded-xl px-4 py-3 hover:shadow-sm {% if (n.at or '') > seen_at %}border-{{ n.tone }}-300{% else %}border-gray-200{% endif %}">
    <div class="flex items-center gap-2 text-xs">
      <span class="px-1.5 py-0.5 rounded bg-{{ n.tone }}-100 text-{{ n.tone }}-800 font-semibold">{{ n.title }}</span>
      <span class="text-gray-400">{{ n.at|dt }}</span>
      {% if (n.at or '') > seen_at %}<span class="w-2 h-2 rounded-full bg-{{ n.tone }}-500"></span>{% endif %}
    </div>
    <div class="text-sm mt-1">{{ n.text|linkify }}</div>
  </a>
  {% else %}<div class="bg-white border border-dashed border-gray-300 rounded-xl p-10 text-center text-sm text-gray-500">あなた宛の通知はありません。</div>{% endfor %}
</div>
{% endblock %}
