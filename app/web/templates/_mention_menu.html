<div x-show="open" x-cloak class="absolute left-0 bottom-full mb-1 w-56 bg-white border border-gray-200 rounded-lg shadow-lg text-sm z-30">
  <template x-for="(p, i) in items" :key="p">
    <button type="button" @mousedown.prevent="pick($el.closest('[x-data]').querySelector('input,textarea'), p)" class="w-full text-left px-3 py-1.5 flex items-center gap-2" :class="i === idx ? 'bg-indigo-50' : 'hover:bg-gray-100'">
      <span class="w-5 h-5 rounded-full grid place-items-center text-[10px] font-semibold" :class="{{ teams_all|tojson|forceescape if teams_all is defined else '[]' }}.includes(p) ? 'bg-violet-100 text-violet-700' : 'bg-indigo-100 text-indigo-700'" x-text="p.slice(0,1)"></span>
      <span x-text="'@' + p"></span></button>
  </template>
</div>
